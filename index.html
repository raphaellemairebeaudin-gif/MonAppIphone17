
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon app</title>
<meta name="theme-color" content="#1a1c1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon app">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>
(function () {
  try {
    var t = localStorage.getItem('theme') || 'auto';
    var d = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = d ? 'dark' : 'light';
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><p id="boot-status" style="padding:24px;color:#f4f4f4;font:16px system-ui">Chargement de l’application…</p></div>
<script>
(function () {
  var app = document.getElementById('app');
  var watchdog = setTimeout(function () {
    if (document.getElementById('boot-status')) {
      app.innerHTML = '<p style="padding:24px;color:#f4f4f4;font:16px system-ui">L’application ne parvient pas à démarrer. Vérifie ta connexion Internet, puis réessaie. Si le problème persiste, signale « démarrage bloqué ».</p>';
    }
  }, 12000);
  window.addEventListener('error', function (event) {
    if (!document.getElementById('boot-status')) return;
    clearTimeout(watchdog);
    app.textContent = 'Erreur de démarrage : ' + (event.message || 'chargement impossible');
    app.style.cssText = 'padding:24px;color:#f4f4f4;font:16px system-ui';
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    if (!document.getElementById('boot-status')) return;
    clearTimeout(watchdog);
    app.textContent = 'Erreur de démarrage : ' + (event.reason?.message || String(event.reason || 'inconnue'));
    app.style.cssText = 'padding:24px;color:#f4f4f4;font:16px system-ui';
  });
})();
</script>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
